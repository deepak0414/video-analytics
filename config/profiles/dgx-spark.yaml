# DGX Spark (GB10, 128GB unified memory). Local-heavy: keep models resident.
# Per-model LOAD params (device/dtype/quant) live here, keyed by model name.

device: cuda
dtype: float16
residency: keep   # keep | unload-after-use — CONSUMED at ingest role-group
                  # boundaries (WS4.e): unload-after-use drops each finished
                  # group's models. Use it for BATCH ingests — keep-resident
                  # starved YOLO to 1/22 clips in a single-process 22-clip
                  # batch; staged measured 22/22 (~90 s/clip reload cost).

models:
  siglip:
    weights: google/siglip-so400m-patch14-384
    dtype: float16
  hash:
    # stub: no real weights; runs anywhere, ignores device
    device: cpu
